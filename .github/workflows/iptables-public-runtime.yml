name: Ubuntu iptables public runtime

on:
  push:
    branches:
      - ot-public-binary-build-20260922
    paths:
      - .github/workflows/iptables-public-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install public Ubuntu firewall packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iptables ipset
      - name: Bundle binaries, extensions, and non-glibc libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fw/bin fw/xtables fw/lib fw/meta
          for tool in iptables iptables-save iptables-restore ip6tables ip6tables-save ip6tables-restore iptables-nft iptables-nft-save iptables-nft-restore ip6tables-nft ip6tables-nft-save ip6tables-nft-restore iptables-legacy iptables-legacy-save iptables-legacy-restore ip6tables-legacy ip6tables-legacy-save ip6tables-legacy-restore ipset; do
            p="$(command -v "$tool" 2>/dev/null || true)"
            [ -n "$p" ] || continue
            install -m755 "$(readlink -f "$p")" "fw/bin/$tool"
          done
          cp -a /usr/lib/x86_64-linux-gnu/xtables/. fw/xtables/
          for lib in libxtables.so.12 libnftnl.so.11 libmnl.so.0 libipset.so.13; do
            p="$(ldconfig -p | awk -v n="$lib" '$1==n {print $NF; exit}')"
            [ -n "$p" ] && cp -L "$p" "fw/lib/$lib"
          done
          {
            uname -a
            iptables --version
            ip6tables --version
            ipset --version || true
            find fw -type f -print0 | sort -z | xargs -0 sha256sum
          } > fw/meta/provenance-and-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-iptables-runtime-24.04
          retention-days: 1
          if-no-files-found: error
          path: fw/
