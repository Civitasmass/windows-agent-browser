<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adaptive search</title>
  <link rel="stylesheet" href="/assets/benchmark.css">
</head>
<body>
  <main class="shell narrow">
    <p class="eyebrow">Outcome race</p>
    <h1>Adaptive search</h1>
    <p class="muted">The server may redirect, render inline, or ask for one local verification step.</p>
    <form id="search-form" class="stack">
      <label for="query">Case query</label>
      <input id="query" name="query" value="quarterly orbit">
      <button type="submit">Run search</button>
    </form>
    <section id="outcome" aria-live="polite"></section>
  </main>
  <script>
    const run = location.pathname.split("/").filter(Boolean).at(-1);
    const form = document.querySelector("#search-form");
    const outcome = document.querySelector("#outcome");

    async function submit(verified = false) {
      const response = await fetch("/api/adaptive/submit", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ run, verified }),
      });
      const result = await response.json();
      if (result.outcome === "redirect") {
        location.assign(result.location);
        return;
      }
      if (result.outcome === "challenge") {
        outcome.innerHTML = `
          <div class="panel challenge" data-outcome="challenge">
            <h2>Local verification</h2>
            <label><input id="verification" type="checkbox"> Confirm the query contains the word orbit</label>
            <button id="continue" type="button">Continue</button>
          </div>`;
        document.querySelector("#continue").addEventListener("click", () => {
          if (!document.querySelector("#verification").checked) return;
          void submit(true);
        });
        return;
      }
      outcome.innerHTML = `
        <div class="panel result" data-outcome="inline">
          <h2>Search complete</h2>
          <p>The branch token is <strong data-token>${result.token}</strong>.</p>
        </div>`;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      outcome.innerHTML = '<p class="muted">Searching...</p>';
      window.setTimeout(() => void submit(false), 180);
    });
  </script>
</body>
</html>
